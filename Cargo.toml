[package]
name = "gnome-portal-bridge"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["patrickjaja"]
description = "GNOME/Wayland portal + PipeWire support bridge for Linux computer-use tooling (Claude Desktop)."

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "std", "help", "suggestions"], default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
lamco-portal = { version = "0.4.2", default-features = false }
lamco-pipewire = { version = "0.4.5", default-features = false }
ashpd = { version = "0.13.11", default-features = false, features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"], default-features = false }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"], default-features = false }
libc = { version = "0.2.186", default-features = false, features = ["std"] }
xkeysym = "0.2.1"
cu-atspi = { git = "https://github.com/patrickjaja/cu-atspi", rev = "a390259e9209fda8bb518a8ef253198ba3435ef0" }
# Shared Computer Use overlay for the `overlay` subcommand: only the XWayland
# backend (Mutter has no layer-shell), pinned by rev like cu-atspi.
cu-overlay = { git = "https://github.com/patrickjaja/cu-overlay", rev = "a839d796e7db6532b107e35a2f9479b22c4b16c3", default-features = false, features = ["x11"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
opt-level = 3
